[package]
name = "piu-rise-controller-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
anyhow = "1.0.100"
directories = "6.0.0"
piu-rise-controller = { path = ".." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = "2"
