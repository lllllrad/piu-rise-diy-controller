[package]
name = "piu-rise-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Windows controller mapper for PUMP IT UP RISE and Novation Launchpads"
license = "MIT"
repository = "https://github.com/lllllrad/piu-rise-diy-controller"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
directories = "6.0.0"
libc = "0.2.189"
midir = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "piu-rise-output-helper"
path = "src/bin/output_helper.rs"
