[tools]
just = "latest"
rust = "1.97.1"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.check]
description = "Run the Rust compiler checks"
run = "cargo check --all-targets"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test --all-targets"

[tasks.docs]
description = "Check bilingual user-document path parity"
run = "sh scripts/check-doc-parity.sh"

[tasks.verify]
description = "Run all local Rust verification"
depends = ["fmt", "check", "test", "docs"]
